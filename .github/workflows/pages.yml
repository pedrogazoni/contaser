# Publica a pasta dist/ no GitHub Pages a cada push na branch main.
# Endereço: https://pedrogazoni.github.io/contaser/
name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No GitHub Pages o site fica em /contaser/, então a página 404 precisa desse caminho base
      - name: Ajustar página 404 para o caminho do GitHub Pages
        run: sed -i 's|<base href="/">|<base href="/${{ github.event.repository.name }}/">|' dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
